<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock & Countdown Timer | ANAND CODE LAB</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at top left, #243b75, transparent 35%),
        radial-gradient(circle at bottom right, #5b176f, transparent 35%),
        #050816;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 520px;
    padding: 30px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 28px;
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(18px);
    box-shadow: 0 25px 70px rgba(0,0,0,.45);
    text-align: center;
}

.brand {
    font-size: 13px;
    letter-spacing: 3px;
    color: #8ee8ff;
    margin-bottom: 8px;
}

h1 {
    font-size: clamp(28px, 7vw, 42px);
    margin-bottom: 25px;
}

.clock {
    font-size: clamp(38px, 11vw, 65px);
    font-weight: 800;
    letter-spacing: 3px;
    color: #75eaff;
    text-shadow: 0 0 25px rgba(117,234,255,.7);
    margin-bottom: 8px;
}

.date {
    color: #bfc8df;
    font-size: 15px;
    margin-bottom: 30px;
}

.divider {
    height: 1px;
    background: rgba(255,255,255,.12);
    margin: 25px 0;
}

h2 {
    margin-bottom: 18px;
    font-size: 22px;
}

.inputs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
}

input {
    width: 100%;
    padding: 14px 8px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 13px;
    outline: none;
    background: rgba(0,0,0,.25);
    color: white;
    text-align: center;
    font-size: 18px;
}

input::placeholder {
    color: #8e99b5;
}

.timer {
    font-size: clamp(38px, 10vw, 58px);
    font-weight: 800;
    color: #d8a7ff;
    text-shadow: 0 0 22px rgba(216,167,255,.55);
    margin: 18px 0;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

button {
    border: none;
    padding: 13px 20px;
    border-radius: 13px;
    color: white;
    background: linear-gradient(135deg, #246bff, #8b35ff);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(92,76,255,.35);
}

button:active {
    transform: scale(.96);
}

.status {
    min-height: 22px;
    margin-top: 15px;
    color: #9defff;
    font-size: 14px;
}

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #78839e;
    letter-spacing: 1px;
}

@media (max-width: 480px) {
    .container {
        padding: 23px 17px;
        border-radius: 22px;
    }

    .inputs {
        gap: 7px;
    }

    input {
        font-size: 16px;
    }

    button {
        flex: 1;
        min-width: 100px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="brand">ANAND CODE LAB</div>

    <h1>Digital Clock</h1>

    <div class="clock" id="clock">00:00:00</div>

    <div class="date" id="date">Loading date...</div>

    <div class="divider"></div>

    <h2>⏱️ Countdown Timer</h2>

    <div class="inputs">
        <input id="hours" type="number" min="0" placeholder="Hours">
        <input id="minutes" type="number" min="0" max="59" placeholder="Minutes">
        <input id="seconds" type="number" min="0" max="59" placeholder="Seconds">
    </div>

    <div class="timer" id="timer">00:00:00</div>

    <div class="buttons">
        <button onclick="startTimer()">▶ Start</button>
        <button onclick="pauseTimer()">⏸ Pause</button>
        <button onclick="resetTimer()">↻ Reset</button>
    </div>

    <div class="status" id="status"></div>

    <div class="footer">
        BUILD • CODE • CREATE 🚀
    </div>

</div>

<script>
/* =========================
   DIGITAL CLOCK
========================= */

function updateClock() {
    const now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();

    hours = String(hours).padStart(2, "0");
    minutes = String(minutes).padStart(2, "0");
    seconds = String(seconds).padStart(2, "0");

    document.getElementById("clock").textContent =
        `${hours}:${minutes}:${seconds}`;

    const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    };

    document.getElementById("date").textContent =
        now.toLocaleDateString("en-IN", options);
}

updateClock();

setInterval(updateClock, 1000);


/* =========================
   COUNTDOWN TIMER
========================= */

let remainingSeconds = 0;
let timerInterval = null;
let running = false;

function formatTime(totalSeconds) {

    const hours = Math.floor(totalSeconds / 3600);

    const minutes = Math.floor(
        (totalSeconds % 3600) / 60
    );

    const seconds = totalSeconds % 60;

    return (
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0")
    );
}

function updateTimerDisplay() {
    document.getElementById("timer").textContent =
        formatTime(remainingSeconds);
}

function getInputTime() {

    const hours =
        parseInt(document.getElementById("hours").value) || 0;

    const minutes =
        parseInt(document.getElementById("minutes").value) || 0;

    const seconds =
        parseInt(document.getElementById("seconds").value) || 0;

    return (hours * 3600) +
           (minutes * 60) +
           seconds;
}

function startTimer() {

    if (running) return;

    if (remainingSeconds <= 0) {
        remainingSeconds = getInputTime();
    }

    if (remainingSeconds <= 0) {
        document.getElementById("status").textContent =
            "⚠️ Please enter a time first!";
        return;
    }

    running = true;

    document.getElementById("status").textContent =
        "⏳ Timer running...";

    timerInterval = setInterval(() => {

        if (remainingSeconds > 0) {

            remainingSeconds--;

            updateTimerDisplay();

        } else {

            pauseTimer();

            document.getElementById("status").textContent =
                "🎉 Time's up!";
        }

    }, 1000);
}

function pauseTimer() {

    clearInterval(timerInterval);

    timerInterval = null;
    running = false;

    if (remainingSeconds > 0) {
        document.getElementById("status").textContent =
            "⏸ Timer paused";
    }
}

function resetTimer() {

    pauseTimer();

    remainingSeconds = 0;

    document.getElementById("hours").value = "";
    document.getElementById("minutes").value = "";
    document.getElementById("seconds").value = "";

    updateTimerDisplay();

    document.getElementById("status").textContent =
        "↻ Timer reset";
}

updateTimerDisplay();


/* =========================
   ENTER KEY
========================= */

document.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        startTimer();
    }

});
</script>

</body>
</html>
